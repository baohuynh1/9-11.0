services:
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service

  user_service:
    # image: storex-user:latest
    image: traefik/whoami
    command: ["--port", "8081", "--name", "user_service"]

  product_service:
    # image: storex-product:latest
    image: traefik/whoami
    command: ["--port", "8082", "--name", "product_service"]
