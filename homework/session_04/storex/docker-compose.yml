services:
  backend:
    build: /home/bao/user-service      # build tu ma nguon, thay cho image storex-backend:latest
    image: storex-backend:latest       # dat ten cho image vua build
    ports:
      - "8080:8080"
    environment:
      # Sua loi: dung ten service "postgres" thay cho "localhost"
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/storex
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=storex
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storex"]
      interval: 5s
      timeout: 3s
      retries: 10
